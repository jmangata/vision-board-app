# =============================================================================
# CD — Continuous Deployment sur Railway
# =============================================================================
# Ce workflow est déclenché à chaque push sur la branche principale.
# Il réutilise le workflow CI existant, puis déploie le backend et le frontend
# sur Railway avec la CLI officielle.
#
# Prérequis dans GitHub Secrets :
#   - RAILWAY_TOKEN  (token API généré dans Railway > Account Settings > Tokens)
#
# Conseil : dans le dashboard Railway, désactive l'auto-deploy natif GitHub
# pour les deux services si tu veux que seul ce workflow déclenche les déploiements.
# =============================================================================

name: CD Railway

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy backend to Railway
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend service
        working-directory: backend
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy frontend to Railway
    needs: [ci, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend service
        working-directory: frontend
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
