# =============================================================================
# CD — Continuous Deployment sur Render
# =============================================================================
# Ce workflow est déclenché à chaque push sur la branche principale.
# Il réutilise le workflow CI existant, puis déploie le backend et le frontend
# sur Render en appelant les "deploy hooks" associés.
#
# Pourquoi utiliser des deploy hooks plutôt que l'auto-deploy natif Render ?
#   - la CI doit passer avant tout déploiement
#   - on garde l'historique des déploiements dans GitHub Actions
#   - on contrôle l'ordre : backend (avec migrations) avant frontend
#
# Prérequis dans GitHub Secrets :
#   - RENDER_DEPLOY_HOOK_BACKEND  (URL du hook du service visionboard-api)
#   - RENDER_DEPLOY_HOOK_FRONTEND (URL du hook du service visionboard-frontend)
# =============================================================================

name: CD

# Déclenchement uniquement après merge/push sur la branche principale.
# Les pushes sur les branches de fonctionnalités et les pull requests utilisent
# le workflow CI directement (cf. .github/workflows/ci.yml).
on:
  push:
    branches: [main]

# Empêche deux déploiements de se marcher sur les pieds si plusieurs commits
# arrivent rapidement. Le groupe est basé sur la référence Git (ici refs/heads/main).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Étape 1 : exécuter la CI (build + checks)
  # ---------------------------------------------------------------------------
  # Le job ci réutilise le workflow défini dans .github/workflows/ci.yml.
  # Si un check échoue, les jobs de déploiement ne seront pas lancés.
  # ---------------------------------------------------------------------------
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Étape 2 : déployer le backend
  # ---------------------------------------------------------------------------
  # Le backend est déployé en premier car il exécute les migrations Prisma.
  # Render build le service, applique preDeployCommand, puis démarre l'API.
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend to Render
    needs: ci                       # Ne se lance que si la CI a réussi
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # curl appelle l'URL unique du deploy hook. Render démarre alors son propre build.
        run: curl -X POST "$RENDER_DEPLOY_HOOK_BACKEND"
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}

  # ---------------------------------------------------------------------------
  # Étape 3 : déployer le frontend
  # ---------------------------------------------------------------------------
  # Le frontend dépend du backend pour s'assurer que l'API est prête.
  # Remarque : l'URL du backend est définie une fois pour toutes dans la
  # variable d'environnement VITE_API_URL du service Render (cf. render.yaml).
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend to Render
    needs: [ci, deploy-backend]     # Attend que le backend soit déployé
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "$RENDER_DEPLOY_HOOK_FRONTEND"
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
