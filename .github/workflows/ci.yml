# Pipeline CI : déclenché sur chaque push et PR vers main.
# Deux jobs indépendants : vérifications du backend, puis build du frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Le client Prisma doit être généré avant la vérification syntaxique
      # (les imports de @prisma/client doivent résoudre)
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # Vérification syntaxique de chaque fichier (pas de suite de tests :
      # node --check valide juste que le code se parse sans erreur)
      - name: Check backend syntax
        working-directory: backend
        run: |
          node --check index.js
          node --check src/prisma.js
          node --check src/controllers/authController.js
          node --check src/controllers/categoryController.js
          node --check src/controllers/goalController.js
          node --check src/controllers/stepController.js
          node --check src/controllers/userController.js
          node --check src/controllers/badgeController.js
          node --check src/controllers/dashboardController.js
          node --check src/controllers/reminderController.js
          node --check src/middlewares/authMiddleware.js
          node --check src/middlewares/errorMiddleware.js
          node --check src/services/badgeService.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Le build Vite échoue en cas d'erreur : c'est le check du frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build
