name: CI

# =============================================================================
# Déclencheurs du workflow CI
# =============================================================================
# - push sur toutes les branches SAUF main : vérifie chaque commit poussé
#   sur une branche de fonctionnalité.
# - pull_request vers main : vérifie chaque PR avant merge.
# - workflow_call : permet au workflow CD (.github/workflows/cd.yml) de
#   réutiliser ce fichier. Cela évite de dupliquer les jobs de vérification.
#
# La branche main est volontairement ignorée ici car le workflow CD
# appelle cette CI une seule fois, puis déploie. Sans cela, la CI serait
# lancée deux fois à chaque push sur main.
# =============================================================================
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Check backend syntax
        working-directory: backend
        run: |
          node --check index.js
          node --check src/prisma.js
          node --check src/controllers/authController.js
          node --check src/controllers/categoryController.js
          node --check src/controllers/goalController.js
          node --check src/controllers/stepController.js
          node --check src/controllers/userController.js
          node --check src/controllers/badgeController.js
          node --check src/controllers/dashboardController.js
          node --check src/controllers/reminderController.js
          node --check src/middlewares/authMiddleware.js
          node --check src/middlewares/errorMiddleware.js
          node --check src/services/badgeService.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
