# Blueprint de déploiement Render (Infrastructure as Code).
# Provisionne la base PostgreSQL managée puis les deux services web.
databases:
  - name: visionboard-db
    databaseName: visionboard
    user: visionboard_user

services:
  # API backend Node.js/Express
  - type: web
    name: visionboard-api
    runtime: node
    rootDir: backend
    # Le build génère le client Prisma, pousse le schéma en base
    # et lance le seed (catégories + badges)
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: node index.js
    envVars:
      # DATABASE_URL est injectée automatiquement depuis la base ci-dessus
      - key: DATABASE_URL
        fromDatabase:
          name: visionboard-db
          property: connectionString
      - key: JWT_SECRET
        value: k8Xp2mN7qR4vW9zB3cF6hJ1dL5gT0yA8sE2uI4oP7nM
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UNSPLASH_ACCESS_KEY
        value: 0tD_RBe9ydiRDVHAsSPq2dsMNcIq_oE2jn-NDDQcwFY
      - key: CLOUDINARY_CLOUD_NAME
        value: visionboard
      - key: CLOUDINARY_API_KEY
        value: 234116794513513
      - key: CLOUDINARY_API_SECRET
        value: H9IZJRRTGo8rsjidHGgXyDDrijY

  # Frontend React : buildé en site statique servi par Render
  - type: web
    name: visionboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Réécriture SPA : toutes les URL renvoient index.html pour que
    # React Router gère la navigation côté client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html