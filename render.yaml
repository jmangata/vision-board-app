databases:
  - name: visionboard-db
    plan: free
    databaseName: visionboard
    user: visionboard_user

services:
  - type: web
    name: visionboard-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visionboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UNSPLASH_ACCESS_KEY
        value: 0tD_RBe9ydiRDVHAsSPq2dsMNcIq_oE2jn-NDDQcwFY
      - key: CLOUDINARY_CLOUD_NAME
        value: visionboard
      - key: CLOUDINARY_API_KEY
        value: 234116794513513
      - key: CLOUDINARY_API_SECRET
        value: H9IZJRRTGo8rsjidHGgXyDDrijY