<script>
        // Micro-interactions for button and input
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalContent;
                // Add a simple ripple or success feedback logic here if desired
            }, 1500);
        });

        // Suppress navigation shell as requested by the "Shell Visibility & Relevance" mandate
        // for transactional screens (Login).
    </script>
