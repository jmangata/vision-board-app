        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

<body class="bg-background text-on-background min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.06)] flex justify-between items-center px-container-padding h-16">
<button aria-label="Retour" class="transition-transform duration-200 active:scale-95 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim">Nouvel Objectif</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 px-container-padding max-w-lg mx-auto">
<form class="flex flex-col gap-lg" id="goal-form">
<!-- Basic Info Section -->
<section class="flex flex-col gap-md">
<div class="group">
<label class="font-label-lg text-label-lg text-outline mb-xs block px-1">Titre de l'objectif</label>
<input class="w-full h-14 bg-surface-container-low rounded-xl px-md font-body-lg text-body-lg border-none focus:ring-2 focus:ring-primary-container transition-all" placeholder="Ex: Courir un marathon" type="text"/>
</div>
<div class="group">
<label class="font-label-lg text-label-lg text-outline mb-xs block px-1">Description</label>
<textarea class="w-full bg-surface-container-low rounded-xl p-md font-body-md text-body-md border-none focus:ring-2 focus:ring-primary-container transition-all resize-none" placeholder="Pourquoi cet objectif est-il important ?" rows="3"></textarea>
</div>
</section>
<!-- Category Selector Grid -->
<section>
<label class="font-label-lg text-label-lg text-outline mb-md block px-1">Catégorie</label>
<div class="grid grid-cols-2 gap-sm">
<!-- Sport -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input checked="" class="sr-only" name="category" type="radio" value="sport"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">fitness_center</span>
<span class="font-label-sm text-label-sm">Sport</span>
</div>
</label>
<!-- Musique -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input class="sr-only" name="category" type="radio" value="musique"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">music_note</span>
<span class="font-label-sm text-label-sm">Musique</span>
</div>
</label>
<!-- Voyage -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input class="sr-only" name="category" type="radio" value="voyage"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">flight</span>
<span class="font-label-sm text-label-sm">Voyage</span>
</div>
</label>
<!-- Finance -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input class="sr-only" name="category" type="radio" value="finance"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">payments</span>
<span class="font-label-sm text-label-sm">Finance</span>
</div>
</label>
<!-- Lecture -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input class="sr-only" name="category" type="radio" value="lecture"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">menu_book</span>
<span class="font-label-sm text-label-sm">Lecture</span>
</div>
</label>
<!-- Autre -->
<label class="relative flex items-center justify-center h-20 bg-surface-container-lowest rounded-xl cursor-pointer border-2 border-transparent transition-all hover:bg-surface-container shadow-sm overflow-hidden has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5">
<input class="sr-only" name="category" type="radio" value="autre"/>
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary">more_horiz</span>
<span class="font-label-sm text-label-sm">Autre</span>
</div>
</label>
</div>
</section>
<!-- Image Selector Section -->
<section>
<label class="font-label-lg text-label-lg text-outline mb-md block px-1">Image de couverture</label>
<div class="flex gap-md">
<button class="flex-1 flex flex-col items-center justify-center gap-xs h-32 border-2 border-dashed border-outline-variant rounded-xl hover:bg-surface-container transition-all text-outline" type="button">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="font-label-sm text-label-sm">Importer</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-xs h-32 border-2 border-dashed border-outline-variant rounded-xl hover:bg-surface-container transition-all text-outline" type="button">
<span class="material-symbols-outlined">search</span>
<span class="font-label-sm text-label-sm">Recherche Unsplash</span>
</button>
</div>
</section>
<!-- Date Picker Section -->
<section>
<label class="font-label-lg text-label-lg text-outline mb-xs block px-1">Date d'échéance (optionnel)</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-low rounded-xl px-md font-body-lg text-body-lg border-none focus:ring-2 focus:ring-primary-container transition-all" type="date"/>
</div>
</section>
</form>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent pt-12">
<button class="w-full h-14 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full shadow-lg pill-button flex items-center justify-center gap-sm" form="goal-form" type="submit">
            Créer l'objectif
            <span class="material-symbols-outlined">auto_awesome</span>
</button>
</div>
<!-- Visual Polish: Soft Ambient Glow -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary-container/5 blur-[120px] rounded-full"></div>
<div class="fixed bottom-0 left-0 -z-10 w-96 h-96 bg-secondary-container/5 blur-[120px] rounded-full"></div>
<script>
        // Simple micro-interaction for category selection
        document.querySelectorAll('input[name="category"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Potential for adding subtle haptic or sound effects here
                console.log(`Selected category: ${e.target.value}`);
            });
        });

        // Form submission prevent default for demo
        document.getElementById('goal-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Show success state or navigate
            const btn = e.target.closest('body').querySelector('button[type="submit"]');
            btn.innerHTML = 'Création en cours...';
            btn.classList.add('opacity-80');
            setTimeout(() => {
                btn.innerHTML = 'Objectif créé ! <span class="material-symbols-outlined">check_circle</span>';
                btn.classList.replace('bg-primary-container', 'bg-secondary');
            }, 1000);
        });
    </script>
</body></html>
